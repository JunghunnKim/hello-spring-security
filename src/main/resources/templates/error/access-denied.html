<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 거부 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .denied-code { font-size: 4rem; font-weight: 800; color: #ef4444; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
        <form th:action="@{/logout}" method="post" class="d-flex ms-auto">
            <button class="btn btn-outline-light btn-sm px-3">로그아웃</button>
        </form>
    </div>
</nav>

<div class="container text-center py-5">
    <div class="denied-code">403</div>
    <h4 class="fw-bold mt-3">접근 권한이 없습니다</h4>
    <p class="text-muted">이 페이지는 관리자(ADMIN)만 접근할 수 있습니다.</p>
    <a th:href="@{/products}" class="btn btn-primary mt-2">상품 목록으로 돌아가기</a>
</div>

<div th:replace="~{footer :: stampFooter}"></div>
</body>
</html>
